services:
#=== web service (Apache + php-fpm unix socket) ======================
 web:
  build:
    context: ./dockerfiles
    dockerfile: Dockerfile-apache
    args:
      USER_ID: ${USER_ID-1000}
      GROUP_ID: ${GROUP_ID-1000}
  image: ${PROJECT}_apache
  dns: 8.8.8.8
  depends_on:
    - php
  ports:
    - ${HTTP_PORT-1050}:80
    #- ${HTTPS_PORT-1250}:443
  volumes:
  - ${FOLDER-./project}:/var/www/html
  - ./etc-apache/apache:/usr/local/apache2/conf/conf.d
  - php-socket:/var/run/php-fpm
  restart: unless-stopped
  networks:
    - dlaravel_net

#=== php service ==========================
 php:
  build:
    context: ./dockerfiles
    dockerfile: Dockerfile-php-${CPU-x86_64}
    args:
      USER_ID: ${USER_ID-1000}
      GROUP_ID: ${GROUP_ID-1000}
  image: ${PROJECT}_php
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./etc/php:/usr/local/etc/php/conf.d
    - ${FOLDER-./project}:/var/www/html
    - ./etc-apache/php-fpm.d/www.conf:/usr/local/etc/php-fpm.d/www.conf
    - ./etc/cache:/home/dlaravel/.composer/cache
    - ./etc/supervisor:/etc/supervisor/conf.d
    - ./etc/disable-db-ssl:/etc/mysql/conf.d/disable-ssl.cnf
    - php-socket:/var/run/php-fpm
  environment:
    - TZ=Asia/Taipei
    - project=${HOST-localhost}
  command: ["sudo", "/usr/bin/supervisord"]
  restart: unless-stopped
  networks:
    - dlaravel_net

networks:
    dlaravel_net:

volumes:
  php-socket:
