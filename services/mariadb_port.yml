services:
 db:
  image: mariadb:12.3
  hostname: db
  ports:
    - ${DB_PORT-1250}:3306
  volumes:
    - ./data/${PROJECT-default}:/var/lib/mysql
    - ${FOLDER-./project}:/var/www/html
  environment:
    - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    - MYSQL_ROOT_HOST=127.0.0.1
    - TZ=Asia/Taipei
  restart: unless-stopped
  networks:
    - dlaravel_net

networks:
    dlaravel_net:
