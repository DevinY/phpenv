# phpenv Apache + PHP-FPM (unix socket)
# Supports project .htaccess (AllowOverride All).
# TLS is often terminated at a front proxy; container usually sees plain HTTP.

RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy 127.0.0.1

<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php index.html

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP via FastCGI over shared unix socket (see etc-apache/php-fpm.d/www.conf)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php-fpm/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    <Proxy "fcgi://localhost/" enablereuse=on max=10>
    </Proxy>

    ProxyTimeout 500

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # Honor HTTPS when behind reverse proxy / NAS
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</VirtualHost>
